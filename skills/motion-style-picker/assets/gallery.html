<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Style Picker — 모션 스타일 갤러리</title>
<style>:root{--border:#ddd;--border-accent:#378add;--surface-2:#fff;--text-secondary:#666;--text-danger:#c00;--font-mono:ui-monospace,monospace}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;max-width:720px;margin:24px auto;padding:0 16px}
button{font:inherit;cursor:pointer}#go{padding:8px 14px;border:1px solid #999;border-radius:8px;background:#fff}
.sr-only{position:absolute;left:-9999px}</style>
<script>function sendPrompt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('복사됐어요. 채팅에 붙여 넣어 주세요.\nCopied — paste it into your chat:\n\n'+t),()=>prompt('이 문장을 복사해 채팅에 붙여 넣어 주세요 / Copy this into your chat:',t))}</script>
</head><body>
<style>
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.c{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface-2);text-align:left;padding:0;font:inherit;color:inherit}
.c.m{outline:2px solid var(--border-accent)}.c.s{outline:2px dashed var(--border-accent)}
.p{height:84px;position:relative;overflow:hidden}
.n{padding:6px 10px 8px;font-size:13px}.n small{display:block;font-size:11px;color:var(--text-secondary)}
.a{position:absolute}
@keyframes pop{0%,100%{transform:scale(.6) rotate(-8deg)}50%{transform:scale(1.15) rotate(4deg)}}
@keyframes sx{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
@keyframes draw{0%{stroke-dashoffset:300}60%,100%{stroke-dashoffset:0}}
@keyframes bar{0%,100%{height:8px}50%{height:50px}}
@keyframes blob{0%,100%{border-radius:40% 60% 60% 40%/50% 40% 60% 50%;transform:rotate(0)}50%{border-radius:60% 40% 30% 70%/40% 60% 40% 60%;transform:rotate(180deg)}}
@keyframes rise{0%,100%{transform:translateY(10px)}50%{transform:translateY(-6px)}}
@keyframes sq{0%,100%{transform:translateY(0) scale(1.2,.8)}50%{transform:translateY(-30px) scale(.9,1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jit{0%{transform:rotate(-6deg) translate(-4px,0)}50%{transform:rotate(5deg) translate(4px,-3px)}100%{transform:rotate(-2deg) translate(0,3px)}}
@keyframes gl{0%,90%,100%{transform:translate(0)}92%{transform:translate(-5px,2px)}95%{transform:translate(5px,-2px)}}
@keyframes scan{to{background-position:0 12px}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes fl{0%,100%{opacity:1}45%{opacity:.3}50%{opacity:1}55%{opacity:.4}}
@keyframes gather{0%,100%{transform:translate(var(--x),var(--y));opacity:.3}50%{transform:translate(0,0);opacity:1}}
@keyframes flash{0%,49%{background:#ff3d7f}50%,100%{background:#1b1464}}
@keyframes bleed{0%,100%{transform:scale(.4);opacity:.2}60%{transform:scale(1.3);opacity:.6}}
@keyframes mis{0%,100%{transform:translate(0)}50%{transform:translate(4px,3px)}}
@keyframes card{0%,100%{transform:translateY(40px);opacity:0}30%,70%{transform:translateY(0);opacity:1}}
@keyframes px1{to{transform:translateX(-50%)}}
</style>
<h2 class="sr-only">모션그래픽 스타일 24종 미리보기 갤러리. 카드를 눌러 메인과 보조 스타일을 고릅니다.</h2>
<div class="g" id="g">
<button class="c" data-id="kinetic-type" data-k="키네틱 타이포"><div class="p" style="background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:500;font-size:22px;color:#111"><span style="display:inline-block;animation:pop 1.2s infinite">MO</span><span style="display:inline-block;animation:pop 1.2s .2s infinite;color:#e63946">VE</span></div><div class="n">키네틱 타이포<small>글자가 리듬 타며 튐</small></div></button>
<button class="c" data-id="flat-2d" data-k="플랫 2D"><div class="p" style="background:#fdf0d5"><div class="a" style="left:55px;top:22px;width:40px;height:40px;border-radius:50%;background:#f4a261;animation:sx 2s infinite"></div><div class="a" style="left:70px;top:46px;width:28px;height:28px;background:#2a9d8f;animation:sx 2s .5s infinite reverse"></div></div><div class="n">플랫 2D<small>단색 도형이 깔끔하게</small></div></button>
<button class="c" data-id="line-art" data-k="라인아트"><div class="p" style="background:#fffdf7"><svg viewBox="0 0 160 84" width="100%" height="84"><path d="M20 60 Q50 10 80 45 T140 30" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="300" style="animation:draw 2.4s infinite"/><circle cx="80" cy="45" r="12" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="300" style="animation:draw 2.4s .4s infinite"/></svg></div><div class="n">라인아트<small>선이 스스로 그려짐</small></div></button>
<button class="c" data-id="infographic" data-k="인포그래픽"><div class="p" style="background:#f1f5fb;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-bottom:12px;box-sizing:border-box"><div style="width:14px;background:#378add;animation:bar 2s infinite"></div><div style="width:14px;background:#85b7eb;animation:bar 2s .3s infinite"></div><div style="width:14px;background:#185fa5;animation:bar 2s .6s infinite"></div><div style="font-size:20px;font-weight:500;color:#0c447c;margin-left:8px;align-self:center">72%</div></div><div class="n">인포그래픽<small>차트·숫자가 차례로</small></div></button>
<button class="c" data-id="whiteboard-doodle" data-k="화이트보드 손그림"><div class="p" style="background:#fff"><svg viewBox="0 0 160 84" width="100%" height="84" style="animation:jit .3s steps(2) infinite"><path d="M30 55 L50 25 L70 55 Z M95 30 q15 -10 30 5 q-5 20 -25 15 q-15 -10 -5 -20" fill="none" stroke="#1d3557" stroke-width="3" stroke-linecap="round" stroke-dasharray="300" style="animation:draw 2.6s infinite"/></svg></div><div class="n">화이트보드 손그림<small>손낙서가 슥슥</small></div></button>
<button class="c" data-id="liquid-morph" data-k="리퀴드 모프"><div class="p" style="background:#1a1033;display:flex;align-items:center;justify-content:center"><div style="width:56px;height:56px;background:#c77dff;animation:blob 4s infinite ease-in-out"></div></div><div class="n">리퀴드 모프<small>액체처럼 흐르며 변신</small></div></button>
<button class="c" data-id="isometric" data-k="아이소메트릭"><div class="p" style="background:#e8f4f0;display:flex;align-items:center;justify-content:center;gap:6px"><div style="width:26px;height:26px;background:#5dcaa5;transform:rotateX(55deg) rotateZ(45deg);animation:rise 1.6s infinite"></div><div style="width:26px;height:26px;background:#f0997b;transform:rotateX(55deg) rotateZ(45deg);animation:rise 1.6s .3s infinite"></div><div style="width:26px;height:26px;background:#7f77dd;transform:rotateX(55deg) rotateZ(45deg);animation:rise 1.6s .6s infinite"></div></div><div class="n">아이소메트릭<small>45° 미니어처 조립</small></div></button>
<button class="c" data-id="3d-clay" data-k="3D 클레이"><div class="p" style="background:#ffe5ec;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-sizing:border-box"><div style="width:40px;height:40px;border-radius:50%;background:#ff8fab;border:3px solid #fb6f92;animation:sq 1s infinite ease-in-out"></div></div><div class="n">3D 클레이<small>말랑한 점토 3D</small></div></button>
<button class="c" data-id="glass-3d" data-k="글래스 3D"><div class="p" style="background:#0f1c2e"><div class="a" style="left:40px;top:14px;width:36px;height:36px;border-radius:50%;background:#ff7a59"></div><div class="a" style="left:80px;top:34px;width:30px;height:30px;border-radius:50%;background:#4cc9f0"></div><div class="a" style="left:52px;top:18px;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.6);animation:spin 6s linear infinite"></div></div><div class="n">글래스 3D<small>반투명 유리 회전</small></div></button>
<button class="c" data-id="paper-collage" data-k="콜라주·컷아웃"><div class="p" style="background:#efe6d8"><div class="a" style="left:30px;top:16px;width:50px;height:34px;background:#e76f51;animation:jit .8s steps(3) infinite"></div><div class="a" style="left:70px;top:34px;width:56px;height:30px;background:#264653;animation:jit .8s .2s steps(3) infinite"></div><div class="a" style="left:60px;top:10px;font-size:15px;font-weight:500;color:#111;background:#fff;padding:2px 4px;animation:jit .8s .4s steps(3) infinite">CUT</div></div><div class="n">콜라주·컷아웃<small>오려 붙인 듯 덜컥</small></div></button>
<button class="c" data-id="rubber-hose" data-k="러버호스 카툰"><div class="p" style="background:#f6e7c1"><svg viewBox="0 0 160 84" width="100%" height="84"><g style="animation:hop .6s infinite ease-in-out;transform-origin:80px 50px"><circle cx="80" cy="42" r="16" fill="#222"/><circle cx="74" cy="38" r="4" fill="#fff"/><circle cx="86" cy="38" r="4" fill="#fff"/><path d="M64 46 q-14 -12 -18 4 M96 46 q14 -12 18 4" fill="none" stroke="#222" stroke-width="3"/></g></svg></div><div class="n">러버호스 카툰<small>고무팔 출렁 캐릭터</small></div></button>
<button class="c" data-id="frame-by-frame" data-k="프레임바이프레임"><div class="p" style="background:#fafafa;display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px;border:3px solid #333;border-radius:45% 55% 50% 50%;animation:jit .5s steps(4) infinite"></div></div><div class="n">프레임바이프레임<small>한 장씩 그린 손맛</small></div></button>
<button class="c" data-id="glitch" data-k="글리치"><div class="p" style="background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500"><span style="position:relative;color:#fff;animation:gl 1.5s infinite">ERROR<span class="a" style="left:-3px;top:0;color:#ff004c;opacity:.8;animation:gl 1.5s .05s infinite">ERROR</span><span class="a" style="left:3px;top:0;color:#00f0ff;opacity:.8;animation:gl 1.5s .1s infinite">ERROR</span></span></div><div class="n">글리치<small>깨지고 어긋나는 화면</small></div></button>
<button class="c" data-id="retro-vhs" data-k="레트로 VHS"><div class="p" style="background:#3a2a4a;display:flex;align-items:center;justify-content:center"><span style="color:#ffd6a5;font-size:18px;font-family:var(--font-mono)">PLAY ▶</span><div class="a" style="inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px);animation:scan .4s linear infinite"></div></div><div class="n">레트로 VHS<small>비디오테이프 질감</small></div></button>
<button class="c" data-id="pixel-8bit" data-k="픽셀 8비트"><div class="p" style="background:#5c94fc;display:flex;align-items:flex-end;justify-content:center"><div style="width:24px;height:24px;background:#e4000f;margin-bottom:16px;animation:hop .6s steps(4) infinite"></div><div class="a" style="bottom:0;left:0;right:0;height:16px;background:#c84c0c"></div></div><div class="n">픽셀 8비트<small>게임 도트 그래픽</small></div></button>
<button class="c" data-id="neon-cyber" data-k="네온 사이버"><div class="p" style="background:#07070f;display:flex;align-items:center;justify-content:center"><div style="width:70px;height:40px;border:2px solid #00f5ff;animation:fl 2s infinite"></div><div class="a" style="width:90px;height:2px;background:#ff2bd6;animation:sx 2s infinite"></div></div><div class="n">네온 사이버<small>어둠 속 네온·HUD</small></div></button>
<button class="c" data-id="particle-abstract" data-k="파티클 추상"><div class="p" style="background:#0d1321;display:flex;align-items:center;justify-content:center"><i class="a" style="width:5px;height:5px;border-radius:50%;background:#9bf6ff;--x:-50px;--y:-25px;animation:gather 2.4s infinite"></i><i class="a" style="width:5px;height:5px;border-radius:50%;background:#bdb2ff;--x:45px;--y:-20px;animation:gather 2.4s .1s infinite"></i><i class="a" style="width:5px;height:5px;border-radius:50%;background:#ffc6ff;--x:-40px;--y:25px;animation:gather 2.4s .2s infinite"></i><i class="a" style="width:5px;height:5px;border-radius:50%;background:#9bf6ff;--x:55px;--y:22px;animation:gather 2.4s .3s infinite"></i><i class="a" style="width:5px;height:5px;border-radius:50%;background:#fff;--x:0px;--y:-32px;animation:gather 2.4s .15s infinite"></i><i class="a" style="width:5px;height:5px;border-radius:50%;background:#fff;--x:5px;--y:32px;animation:gather 2.4s .25s infinite"></i></div><div class="n">파티클 추상<small>입자가 모였다 흩어짐</small></div></button>
<button class="c" data-id="geometric-minimal" data-k="미니멀 기하"><div class="p" style="background:#f7f7f5;display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px;border:2px solid #111;border-radius:50%;position:relative;animation:spin 3s cubic-bezier(.7,0,.3,1) infinite"><div class="a" style="left:20px;top:-6px;width:2px;height:20px;background:#e63946"></div></div></div><div class="n">미니멀 기하<small>원·선만으로 정갈</small></div></button>
<button class="c" data-id="swiss-grid" data-k="스위스 그리드"><div class="p" style="background:#fff"><div class="a" style="left:0;top:0;width:50%;height:100%;background:#e30613;animation:sx 1.6s steps(2) infinite"></div><div class="a" style="right:12px;bottom:8px;font-size:26px;font-weight:500;color:#111">Grid</div></div><div class="n">스위스 그리드<small>격자 위 큰 활자</small></div></button>
<button class="c" data-id="duotone-pop" data-k="듀오톤 팝"><div class="p" style="animation:flash 1s infinite;display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px;border-radius:50%;background:#ffe600;animation:pop .5s infinite"></div></div><div class="n">듀오톤 팝<small>두 강한 색이 번쩍</small></div></button>
<button class="c" data-id="watercolor" data-k="수채화"><div class="p" style="background:#fbf8f1"><div class="a" style="left:40px;top:12px;width:50px;height:50px;border-radius:50%;background:#90caf9;animation:bleed 3s infinite"></div><div class="a" style="left:75px;top:24px;width:46px;height:46px;border-radius:50%;background:#f8bbd0;animation:bleed 3s 1s infinite"></div></div><div class="n">수채화<small>물감이 번지며 등장</small></div></button>
<button class="c" data-id="risograph-grain" data-k="리소그래프"><div class="p" style="background:#f4efe6"><div class="a" style="left:52px;top:18px;width:46px;height:46px;border-radius:50%;background:#ff48b0;opacity:.85"></div><div class="a" style="left:62px;top:24px;width:46px;height:46px;border-radius:50%;background:#0078bf;opacity:.7;animation:mis 1s steps(2) infinite"></div></div><div class="n">리소그래프<small>어긋난 인쇄 색판</small></div></button>
<button class="c" data-id="ui-motion" data-k="UI 모션"><div class="p" style="background:#eef0f4;display:flex;justify-content:center;padding-top:6px;box-sizing:border-box"><div style="width:52px;height:100px;border-radius:10px;background:#fff;border:1px solid #c9ced8;padding:6px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px"><div style="height:12px;border-radius:3px;background:#378add;animation:card 2.4s infinite"></div><div style="height:12px;border-radius:3px;background:#b5d4f4;animation:card 2.4s .2s infinite"></div><div style="height:12px;border-radius:3px;background:#b5d4f4;animation:card 2.4s .4s infinite"></div></div></div><div class="n">UI 모션<small>앱 화면 매끄럽게</small></div></button>
<button class="c" data-id="parallax-2-5d" data-k="2.5D 패럴랙스"><div class="p" style="background:#ffd6a5"><div class="a" style="left:0;bottom:22px;width:200%;height:30px;background:repeating-linear-gradient(90deg,#e9a178 0 40px,transparent 40px 80px);animation:px1 8s linear infinite"></div><div class="a" style="left:0;bottom:0;width:200%;height:26px;background:repeating-linear-gradient(90deg,#6d597a 0 30px,#b56576 30px 60px);animation:px1 3s linear infinite"></div></div><div class="n">2.5D 패럴랙스<small>레이어가 깊이감 있게</small></div></button>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap">
<span id="st" style="font-size:13px;color:var(--text-secondary)">첫 번째 클릭은 메인 스타일(실선), 두 번째 클릭은 보조 스타일(점선)이에요.</span>
<button id="go" style="margin-left:auto">이 스타일로 진행 ↗</button>
</div>
<script>
let m=null,s=null;const st=document.getElementById('st');
function paint(){document.querySelectorAll('.c').forEach(c=>{c.classList.toggle('m',c===m);c.classList.toggle('s',c===s)});st.textContent=m?('메인: '+m.dataset.k+(s?' · 보조: '+s.dataset.k:' · 보조는 선택 사항이에요')):'첫 번째 클릭은 메인 스타일(실선), 두 번째 클릭은 보조 스타일(점선)이에요.';st.style.color='var(--text-secondary)'}
document.getElementById('g').addEventListener('click',e=>{const c=e.target.closest('.c');if(!c)return;if(c===m){m=s;s=null}else if(c===s){s=null}else if(!m){m=c}else{s=c}paint()});
document.getElementById('go').addEventListener('click',()=>{if(!m){st.textContent='메인 스타일을 먼저 하나 골라 주세요.';st.style.color='var(--text-danger)';return}sendPrompt('모션 스타일 선택 → 메인: '+m.dataset.id+' ('+m.dataset.k+')'+(s?', 보조: '+s.dataset.id+' ('+s.dataset.k+')':', 보조: 없음'))});
</script>
</body></html>
